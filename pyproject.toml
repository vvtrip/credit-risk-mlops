[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "credit-risk-mlops"
version = "0.1.0"
description = "End-to-end classical ML credit-risk project with MLOps practices"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110,<1",
  "joblib>=1.3,<2",
  "mlflow>=2.12,<4",
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "PyYAML>=6,<7",
  "certifi>=2024.2.2",
  "python-dotenv>=1.0,<2",
  "scikit-learn>=1.3,<2",
  "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "ruff>=0.6,<1"]

[project.scripts]
credit-risk = "credit_risk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
credit_risk = ["ui/*.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
